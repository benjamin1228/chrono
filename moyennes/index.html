<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Moyennes">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1320" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<title>Mes moyennes</title>
<style>
  :root{
    --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#F8F9FB; --chip:#EEF0F4;
    --ink:#101828; --ink-2:#344054; --muted:#667085; --faint:#98A2B3;
    --border:rgba(16,24,40,.08); --border-2:rgba(16,24,40,.14);
    --pass:#12805C; --pass-bg:#ECFDF3; --pass-bd:#ABEFC6;
    --fail:#D92D20; --fail-bg:#FEF3F2; --fail-bd:#FECDCA;
    --plan:#5B4BD6; --plan-bg:#F2F0FE; --plan-bd:#D3CCFB;
    --zone-low:rgba(217,45,32,.08); --zone-high:rgba(18,128,92,.09); --rail:#E4E7EC;
    --sh-1:0 1px 2px rgba(16,24,40,.04);
    --sh-2:0 1px 2px rgba(16,24,40,.04),0 8px 20px -8px rgba(16,24,40,.10);
    --sh-3:0 28px 60px -18px rgba(16,24,40,.32),0 2px 6px rgba(16,24,40,.06);
    --glass:rgba(255,255,255,.80); --scrim:rgba(16,24,40,.36);
    --num:"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
    --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
    --safe-b:env(safe-area-inset-bottom);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0A0D14; --surface:#121722; --surface-2:#161C29; --chip:#1E2533;
      --ink:#F2F4F7; --ink-2:#D0D5DD; --muted:#98A2B3; --faint:#667085;
      --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.13);
      --pass:#47CD89; --pass-bg:rgba(71,205,137,.10); --pass-bd:rgba(71,205,137,.28);
      --fail:#F97066; --fail-bg:rgba(249,112,102,.10); --fail-bd:rgba(249,112,102,.30);
      --plan:#A99CFF; --plan-bg:rgba(169,156,255,.11); --plan-bd:rgba(169,156,255,.32);
      --zone-low:rgba(249,112,102,.10); --zone-high:rgba(71,205,137,.10); --rail:#232B3A;
      --sh-1:0 1px 2px rgba(0,0,0,.35);
      --sh-2:0 1px 2px rgba(0,0,0,.35),0 10px 28px -10px rgba(0,0,0,.6);
      --sh-3:0 30px 70px -16px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.06);
      --glass:rgba(18,23,34,.80); --scrim:rgba(0,0,0,.58);
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
  :focus-visible{outline:2px solid var(--plan);outline-offset:2px;border-radius:10px}
  [hidden]{display:none!important}
  .pass{color:var(--pass)} .fail{color:var(--fail)} .plan{color:var(--plan)}
  .ic{width:20px;height:20px;flex-shrink:0;display:block}

  /* ---------- layout ---------- */
  #app{max-width:640px;margin:0 auto;
    padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(118px + var(--safe-b)) calc(16px + env(safe-area-inset-left))}
  @media (min-width:700px){ #app{max-width:860px;padding-left:28px;padding-right:28px} }
  @media (min-width:1024px){
    #app{max-width:none;margin:0;padding:40px 48px 72px calc(248px + 48px)}
    #view{max-width:1100px;margin:0 auto}
  }

  .phead{margin:6px 2px 22px}
  .ptitle{font-family:var(--num);font-size:32px;font-weight:750;letter-spacing:-.032em;line-height:1.05;margin:0}
  .psub{margin:6px 0 0;color:var(--muted);font-size:14px}
  @media (min-width:1024px){ .ptitle{font-size:38px} .phead{margin:0 2px 28px} }

  h2.sec{font-size:15px;font-weight:650;letter-spacing:-.01em;color:var(--ink);margin:30px 4px 10px}
  .shead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 2px 10px}
  .shead h2.sec{margin:0 2px}

  /* ---------- hero ---------- */
  .hero{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 22px 20px;box-shadow:var(--sh-2)}
  .hero-top{display:flex;flex-direction:column;gap:2px}
  .hero-label{font-size:13.5px;font-weight:550;color:var(--muted)}
  .hero-num{font-family:var(--num);font-weight:800;font-size:78px;line-height:.92;letter-spacing:-.045em;margin:10px 0 16px;font-variant-numeric:tabular-nums}
  .hero-num.md{font-size:52px;margin:8px 0 20px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  @media (min-width:700px){
    .hero{padding:26px 28px 22px}
    .hero-top{flex-direction:row;justify-content:space-between;align-items:flex-end;gap:16px}
    .hero-top .hero-num{margin-bottom:26px}
    .chips{justify-content:flex-end;margin-bottom:28px;max-width:55%}
  }
  @media (min-width:1024px){ .hero-top .hero-num{font-size:104px} }
  .chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;
    background:var(--surface-2);border:1px solid var(--border);color:var(--ink-2)}
  .chip .ic{width:15px;height:15px}
  .chip.pass{background:var(--pass-bg);border-color:var(--pass-bd);color:var(--pass)}
  .chip.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
  .chip.plan{background:var(--plan-bg);border-color:var(--plan-bd);color:var(--plan)}
  .hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .hero-row .right{text-align:right}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
  .split > div{background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:10px 12px}
  .split small{display:block;font-size:12.5px;color:var(--muted);font-weight:550}
  .split b{font-family:var(--num);font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}

  /* ---------- the 1–6 scale ---------- */
  .scale{position:relative;height:6px;margin:4px 0}
  .scale .rail{position:absolute;inset:0;border-radius:99px;background:var(--rail);overflow:hidden}
  .scale .zone{position:absolute;top:0;bottom:0}
  .scale .zone.low{left:0;width:60%;background:var(--zone-low)}
  .scale .zone.high{left:60%;right:0;background:var(--zone-high)}
  .scale .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transform-origin:left center}
  .scale .fill.pass{background:linear-gradient(90deg,color-mix(in srgb,var(--pass) 30%,transparent),var(--pass))}
  .scale .fill.fail{background:linear-gradient(90deg,color-mix(in srgb,var(--fail) 30%,transparent),var(--fail))}
  .scale .passline{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;border-radius:2px;background:var(--ink);opacity:.75}
  .scale .dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--surface);border:3.5px solid currentColor;box-shadow:0 1px 3px rgba(16,24,40,.28)}
  .scale .dot.pass{color:var(--pass)} .scale .dot.fail{color:var(--fail)}
  .scale .dot.plan{color:var(--plan);width:10px;height:10px;margin:-5px 0 0 -5px;border-width:2.5px;box-shadow:none}
  .scale .planseg{position:absolute;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--plan) 0 4px,transparent 4px 7px)}
  .scale.big{height:10px;margin:0 0 32px}
  .scale.big .passline{top:-6px;bottom:-6px}
  .scale.big .dot{width:24px;height:24px;margin:-12px 0 0 -12px;border-width:5.5px}
  .scale.big .dot.plan{width:14px;height:14px;margin:-7px 0 0 -7px;border-width:3px}
  .scale .ticks{position:absolute;left:0;right:0;top:20px;height:14px}
  .scale .tick{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
  .scale .tick.four{color:var(--ink);font-weight:700}

  /* ---------- stats & alert ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1);min-width:0}
  .stat-k{display:block;font-size:12.5px;font-weight:550;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-v{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-family:var(--num);font-size:25px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat-v small{font-size:14px;font-weight:650}
  @media (min-width:1024px){
    .home-top{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:16px;align-items:stretch}
    .home-top .hero{display:flex;flex-direction:column;justify-content:center}
    .stats{grid-template-columns:1fr;margin-top:0}
    .stat{display:flex;flex-direction:column;justify-content:center;padding:16px 18px;border-radius:18px}
    .stat-v{font-size:30px}
  }
  .alert{display:flex;gap:12px;align-items:flex-start;margin-top:12px;background:var(--fail-bg);border:1px solid var(--fail-bd);border-radius:16px;padding:12px 14px;font-size:14.5px;color:var(--ink-2)}
  .alert > .ic{color:var(--fail);margin-top:1px}
  .alert b{display:block;color:var(--fail);font-weight:650}
  .alert button{font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--fail-bd);text-underline-offset:3px;text-decoration-thickness:2px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:600;font-size:16px;padding:13px 16px;
    transition:background .15s,border-color .15s,box-shadow .15s,transform .1s,color .15s}
  .btn .ic{width:18px;height:18px}
  .btn.sm{font-size:14px;padding:7px 12px;border-radius:10px;gap:6px}
  .btn.sm .ic{width:16px;height:16px}
  .btn.primary{background:var(--ink);color:var(--surface);box-shadow:0 1px 2px rgba(16,24,40,.22),inset 0 1px 0 rgba(255,255,255,.14)}
  .btn.secondary{background:var(--surface);border:1px solid var(--border-2);color:var(--ink);box-shadow:var(--sh-1)}
  .btn.ghost{color:var(--plan)}
  .btn.quiet{background:var(--chip);color:var(--ink)}
  .btn.danger{color:var(--fail)}
  .btn.danger.armed{background:var(--fail);color:#fff}
  .btn:active{transform:scale(.98)}

  /* ---------- domain list / cards ---------- */
  .dgrid{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
  .dgrid > .drow + .drow{border-top:1px solid var(--border)}
  .drow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 16px;gap:14px;align-items:center;width:100%;padding:14px 12px 14px 16px;
    transition:background .15s,border-color .15s,box-shadow .2s,transform .2s var(--ease)}
  .badge{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--chip);border:1px solid var(--border);color:var(--ink);font-family:var(--num);font-weight:750;font-size:17px}
  .badge.pass{background:var(--pass-bg);border-color:var(--pass-bd);color:var(--pass)}
  .badge.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
  .badge.xl{width:54px;height:54px;border-radius:16px;font-size:23px;flex-shrink:0}
  .dmain{min-width:0;display:flex;flex-direction:column;gap:10px}
  .dname{font-size:15px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dnum{text-align:right;font-family:var(--num);font-weight:750;font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
  .dnum small{display:block;font-size:13.5px;font-weight:650;margin-top:5px}
  .chev{width:16px;height:16px;color:var(--faint)}
  .dneed{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:-4px;line-height:1.3}
  .dneed .ic{width:14px;height:14px;color:var(--plan)}
  .dneed b{color:var(--ink);font-weight:700;font-family:var(--num);font-size:14px}
  .dneed b.pass{color:var(--pass)} .dneed b.fail{color:var(--fail)}
  .needlist{border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .nrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;font-size:14.5px;color:var(--ink-2)}
  .nrow + .nrow{border-top:1px solid var(--border)}
  .nrow small{color:var(--faint);font-size:12.5px;margin-left:4px}
  .nrow strong{font-family:var(--num);font-size:19px;font-weight:750;color:var(--ink);white-space:nowrap}
  .nrow strong.pass{color:var(--pass);font-family:var(--ui);font-size:14px;font-weight:650}
  .nrow strong.fail{color:var(--fail)}
  .cardhead .ch-t{flex:1;min-width:0}
  @media (min-width:700px){
    .dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:none;border:0;box-shadow:none;overflow:visible;border-radius:0}
    .dgrid > .drow + .drow{border-top:0}
    .drow{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-1);padding:18px;
      grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"badge . num" "name name name" "need need need" "scale scale scale";row-gap:14px;align-items:start}
    .drow .badge{grid-area:badge}
    .drow .dmain{display:contents}
    .drow .dname{grid-area:name;min-height:2.6em}
    .drow .scale{grid-area:scale;align-self:end;margin-bottom:6px}
    .drow .dneed{grid-area:need;margin-top:-6px}
    .drow .dnum{grid-area:num;font-size:30px}
    .drow .chev{display:none}
  }
  @media (min-width:1280px){ .dgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }

  /* ---------- lists ---------- */
  .list{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
  .list > * + *{border-top:1px solid var(--border)}
  .srow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;font-size:15.5px;transition:background .15s}
  .lead{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--chip);color:var(--ink-2);flex-shrink:0}
  .lead .ic{width:17px;height:17px}
  .stext{flex:1;min-width:0;line-height:1.3}
  .val{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
  .srow.danger{color:var(--fail);font-weight:600}
  .srow.danger .lead{background:var(--fail-bg);color:var(--fail)}
  .srow.armed{background:var(--fail);color:#fff;justify-content:center;padding:18px 14px}
  .note{font-size:13.5px;color:var(--muted);margin:10px 6px 0;line-height:1.5;max-width:62ch}
  .hint{font-size:13.5px;color:var(--muted);margin:12px 0 0}

  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px;background:var(--surface);border:1px dashed var(--border-2);border-radius:18px}
  .empty-ic{width:30px;height:30px;color:var(--faint);margin-bottom:10px}
  .empty-t{margin:0;font-weight:650;font-size:16px}
  .empty-d{margin:4px 0 16px;color:var(--muted);font-size:14.5px;max-width:36ch}
  .empty-d:last-child{margin-bottom:0}
  .list .empty-s{padding:16px;color:var(--muted);font-size:14.5px}

  /* ---------- domain page ---------- */
  .dtop{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
  .crumb{display:inline-flex;align-items:center;gap:2px;color:var(--plan);font-weight:600;font-size:16px;padding:6px 10px 6px 0;border-radius:10px}
  .crumb .ic{width:20px;height:20px}
  .dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
  .dhead-t{min-width:0}
  .dtitle{font-family:var(--num);font-size:22px;font-weight:750;letter-spacing:-.025em;line-height:1.15;margin:0}
  .dhead .psub{margin-top:4px}
  @media (min-width:700px){ .dtitle{font-size:27px} .dhead{align-items:center} }
  @media (min-width:1024px){ .dtitle{font-size:32px} .dhead{margin-bottom:28px} }
  .dlayout{display:flex;flex-direction:column;gap:14px}
  .dside{display:contents}
  .hero-d,.goalwrap{order:-1}
  .dmaincol{order:0;display:flex;flex-direction:column;gap:14px;min-width:0}
  .simwrap{order:1}
  @media (min-width:1024px){
    .dlayout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
    .dside{display:flex;flex-direction:column;gap:16px;position:sticky;top:32px}
    .hero-d,.goalwrap,.dmaincol,.simwrap{order:0}
  }

  .block{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh-1);overflow:hidden}
  .block > * + *{border-top:1px solid var(--border)}
  .bhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px 12px 16px;background:var(--surface-2)}
  .bname{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-weight:650;font-size:15.5px;min-width:0;border-radius:8px}
  .bedit{width:15px;height:15px;color:var(--faint);transition:opacity .15s}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border-2);color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
  .tag.plan{background:var(--plan-bg);border-color:var(--plan-bd);color:var(--plan)}
  .bavg{font-family:var(--num);font-weight:750;font-size:21px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .bavg small{font-size:14px;margin-left:6px}
  .addsub{align-self:flex-start;padding-left:4px}

  .thead{display:none}
  .erow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px 12px 16px;transition:background .12s}
  .ec-name{flex:1;min-width:0}
  .ename{display:block;font-size:15px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .emeta{display:flex;flex-wrap:wrap;gap:3px 10px;margin-top:3px;font-size:13px;color:var(--muted)}
  .emeta:empty{display:none}
  .ectx b{color:var(--ink);font-weight:650}
  .flag{color:var(--plan);font-weight:600}
  .ec-date,.ec-coef{display:none}
  @media (min-width:700px){
    .thead{display:grid;grid-template-columns:minmax(0,1fr) 104px 56px 64px;gap:12px;padding:8px 14px 8px 16px;font-size:12.5px;font-weight:600;color:var(--faint)}
    .thead .r{text-align:right}
    .erow{display:grid;grid-template-columns:minmax(0,1fr) 104px 56px 64px;gap:12px;padding:13px 14px 13px 16px}
    .ec-date,.ec-coef{display:block;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
    .m-only{display:none}
  }
  .pill{justify-self:end;flex-shrink:0;display:inline-grid;place-items:center;min-width:54px;height:32px;padding:0 10px;border-radius:9px;
    font-family:var(--num);font-weight:750;font-size:17px;font-variant-numeric:tabular-nums;border:1px solid transparent}
  .pill.pass{background:var(--pass-bg);border-color:var(--pass-bd);color:var(--pass)}
  .pill.fail{background:var(--fail-bg);border-color:var(--fail-bd);color:var(--fail)}
  .pill.plan{background:var(--plan-bg);border:1.5px dashed var(--plan);color:var(--plan)}
  .pill.ne{white-space:nowrap;min-width:62px;font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted);background:var(--chip)}
  .pill.none{color:var(--faint);background:var(--chip)}
  .addrow{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;color:var(--plan);font-weight:600;font-size:15px;transition:background .15s}
  .addrow .ic{width:17px;height:17px}

  /* ---------- cards: simulation & chart ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--sh-1)}
  .cardhead{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  .cardhead h2{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  .cardhead p{margin:1px 0 0;font-size:13.5px;color:var(--muted)}
  .cardhead .lead{background:var(--plan-bg);color:var(--plan)}
  .lbl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:550;color:var(--muted)}
  .inp{width:100%;background:var(--surface-2);border:1px solid var(--border-2);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--ink);outline:none;
    -webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
  .inp:focus{border-color:var(--plan);box-shadow:0 0 0 4px var(--plan-bg)}
  .inp::placeholder{color:var(--faint)}
  select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
  input[type=date].inp{min-height:46px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .simgrid{display:flex;gap:10px}
  .simgrid > .lbl:first-child{flex:1;min-width:0}
  .simgrid > .lbl + .lbl{flex:0 0 92px}
  .slider{margin:20px 0 2px}
  .sline{display:flex;justify-content:space-between;align-items:baseline}
  .sline span{font-size:14.5px;color:var(--muted)}
  .sline strong{font-family:var(--num);font-size:36px;font-weight:800;line-height:1;color:var(--plan);font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:8px 0 6px;background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--zone-low) 0 60%,var(--zone-high) 60% 100%),var(--rail)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--plan);box-shadow:0 2px 8px rgba(16,24,40,.25)}
  input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--rail)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:3px solid var(--plan)}
  .sres{font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
  .sres-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .sres strong,.needout strong{font-family:var(--num);font-size:22px;font-weight:750;color:var(--ink)}
  .sres strong.pass{color:var(--pass)} .sres strong.fail{color:var(--fail)} .needout strong.pass{color:var(--pass)} .needout strong.fail{color:var(--fail)}
  .need{margin-top:18px;padding-top:18px;border-top:1px solid var(--border);display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:end}
  .needout{font-size:15px;color:var(--ink-2);padding-bottom:10px;line-height:1.35}

  .chart{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px 18px 14px;box-shadow:var(--sh-2)}
  .chart-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
  .chart-v{font-family:var(--num);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart .cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:8px}
  .month{font-size:14px;font-weight:650;color:var(--muted);margin:26px 4px 10px}

  /* ---------- segmented control ---------- */
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--chip);border-radius:11px;padding:3px;margin:12px}
  .seg button{padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);text-align:center;transition:background .2s,color .2s,box-shadow .2s}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

  /* ---------- navigation ---------- */
  .tabbar{position:fixed;z-index:10;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(calc(100% - 28px),400px);padding:6px;border-radius:24px;
    background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border:1px solid var(--border);
    box-shadow:0 12px 32px -12px rgba(16,24,40,.28),0 1px 2px rgba(16,24,40,.06)}
  .brand,.brand-foot{display:none}
  .tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:18px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;transition:background .2s,color .2s,box-shadow .2s}
  .tab .ic{width:22px;height:22px}
  .tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
  @media (min-width:1024px){
    .tabbar{left:0;top:0;bottom:0;transform:none;width:248px;padding:28px 14px 24px;border-radius:0;border:0;border-right:1px solid var(--border);
      background:var(--surface);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:0 10px 28px;font-family:var(--num);font-weight:750;font-size:19px;letter-spacing:-.02em}
    .brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--surface)}
    .brand-mark .ic{width:20px;height:20px}
    .tabbar .in{display:flex;flex-direction:column;gap:2px}
    .tab{flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 10px;border-radius:10px;font-size:14.5px}
    .tab .ic{width:19px;height:19px}
    .tab.on{background:var(--chip);box-shadow:none}
    .brand-foot{display:block;margin:auto 10px 0;font-size:12.5px;line-height:1.45;color:var(--faint)}
  }

  /* ---------- sheet (modal) ---------- */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
  .backdrop{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .sheet-body{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;
    padding:10px 20px calc(20px + var(--safe-b));box-shadow:var(--sh-3)}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--border-2);margin:0 auto 14px}
  .sheet-x{position:absolute;top:16px;right:16px;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--muted);transition:background .15s,color .15s}
  .sheet-x .ic{width:17px;height:17px}
  .sheet h2{font-family:var(--num);font-size:22px;font-weight:750;letter-spacing:-.02em;margin:2px 44px 4px 0}
  .sheet .ctx{font-size:14px;color:var(--muted);margin:0 0 18px}
  .fstack{display:flex;flex-direction:column;gap:14px}
  @media (min-width:700px){
    .sheet{align-items:center;padding:24px}
    .sheet-body{max-width:480px;border-radius:22px;padding:26px 26px 24px}
    .grab{display:none}
    .sheet-x{top:20px;right:20px}
  }
  .switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15.5px;padding:10px 12px;cursor:pointer;background:var(--surface-2);border:1px solid var(--border);border-radius:12px}
  .switch small{display:block;color:var(--muted);font-size:13px}
  .switch input{position:absolute;opacity:0;pointer-events:none}
  .switch .knob{flex-shrink:0;position:relative;width:46px;height:28px;border-radius:14px;background:var(--rail);transition:background .2s}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.3);transition:transform .2s var(--ease)}
  .switch input:checked + .knob{background:var(--plan)}
  .switch input:checked + .knob::after{transform:translateX(18px)}
  .switch input:focus-visible + .knob{outline:2px solid var(--plan);outline-offset:2px}
  .actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .actions .btn{width:100%}
  .err{display:flex;align-items:center;gap:8px;color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail-bd);border-radius:10px;padding:9px 12px;font-size:14px;font-weight:550}
  .err:empty{display:none}
  textarea.inp{min-height:130px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:vertical}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;
    background:var(--ink);color:var(--surface);padding:10px 16px 10px 12px;border-radius:14px;font-size:14.5px;font-weight:600;white-space:nowrap;box-shadow:var(--sh-3)}
  .toast .ic{width:18px;height:18px;color:var(--pass)}

  /* ---------- hover (pointer devices only) ---------- */
  @media (hover:hover){
    .drow:hover,.erow:hover,.srow:hover:not(.armed),.addrow:hover{background:var(--surface-2)}
    .addrow:hover{background:var(--plan-bg)}
    .btn.primary:hover{background:color-mix(in srgb,var(--ink) 88%,var(--plan))}
    .btn.secondary:hover{border-color:var(--faint)}
    .btn.ghost:hover{background:var(--plan-bg)}
    .btn.quiet:hover{background:var(--border-2)}
    .btn.danger:hover:not(.armed){background:var(--fail-bg)}
    .crumb:hover{background:var(--plan-bg)}
    .tab:hover:not(.on){color:var(--ink);background:var(--surface-2)}
    .sheet-x:hover{background:var(--border-2);color:var(--ink)}
    .bname .bedit{opacity:0}
    .bname:hover .bedit{opacity:1}
    .bname:hover{color:var(--plan)}
    .seg button:hover:not(.on){color:var(--ink)}
  }
  @media (hover:hover) and (min-width:700px){
    .drow:hover{background:var(--surface);border-color:var(--border-2);box-shadow:var(--sh-2);transform:translateY(-2px)}
  }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: no-preference){
    .enter{animation:enter .26s var(--ease)}
    .intro .scale .fill{animation:grow 1s var(--ease) both}
    .intro .scale .dot:not(.plan){animation:slide 1s var(--ease) both}
    .intro .hero-num{animation:fadein .6s ease-out both}
    .sheet-body{animation:rise .3s var(--ease)}
    .backdrop{animation:fadein .2s ease-out}
    .toast{animation:drop .3s var(--ease)}
    @media (min-width:700px){ .sheet-body{animation:pop .22s var(--ease)} }
  }
  @keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes grow{from{transform:scaleX(0)}}
  @keyframes slide{from{left:0}}
  @keyframes fadein{from{opacity:0}}
  @keyframes rise{from{transform:translateY(48px);opacity:.4}to{transform:none;opacity:1}}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  @keyframes drop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>

<nav class="tabbar" aria-label="Navigation">
  <div class="brand"><span class="brand-mark"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="7.5" width="19" height="9" rx="2.5"/><path d="M6.5 7.5v3M10 7.5v4.5M13.5 7.5v3M17 7.5v3"/></svg></span>Moyennes</div>
  <div class="in">
    <button class="tab" data-tab="notes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Notes</span></button>
    <button class="tab" data-tab="hist"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Historique</span></button>
    <button class="tab" data-tab="set"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Réglages</span></button>
  </div>
  <p class="brand-foot">Tes notes restent sur cet appareil. Rien n'est envoyé en ligne.</p>
</nav>

<div id="sheet" class="sheet" hidden><div class="backdrop" data-act="close"></div><div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
const KEY = "moyennes-v2", OLD = "moyennes-v1", IMP = "moyennes-imported";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const num = s => { const n = parseFloat(String(s ?? "").replace(",", ".").trim()); return isFinite(n) ? n : NaN; };
const clone = o => JSON.parse(JSON.stringify(o));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };

const emptyState = () => ({ v: 2, subjects: [], extras: [], settings: { dec: 1, goal: null }, updatedAt: 0 });
let S = emptyState();
let nav = { tab: "notes", dom: null };
const sim = {};
let sheet = null;
let animNext = false;

/* ---------- data ---------- */
const nG = x => { const n = +x; return x !== null && x !== "" && isFinite(n) && n >= 1 && n <= 6 ? Math.round(n * 100) / 100 : null; };
const nW = (x, d = 1) => { const n = +x; return isFinite(n) && n >= 0 && n <= 100 ? n : d; };
const nDate = d => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : "";
const nStr = (s, max, d = "") => typeof s === "string" ? s.slice(0, max) : d;

function normalize(d){
  if (!d || !Array.isArray(d.subjects)) return null;
  const o = emptyState();
  const st = d.settings || {};
  o.settings = { dec: st.dec === 2 ? 2 : 1, goal: nG(st.goal) };
  o.extras = (Array.isArray(d.extras) ? d.extras : []).filter(x => x && typeof x.name === "string")
    .map(x => ({ id: x.id || uid(), name: nStr(x.name, 100), p: isFinite(+x.p) && x.p !== null ? Math.max(0, Math.min(100, +x.p)) : null }));
  o.subjects = d.subjects.filter(s => s && typeof s.name === "string").map(s => {
    let subs = Array.isArray(s.subs) ? s.subs
      : Array.isArray(s.grades) ? [{ name: "Notes", w: 1, evals: s.grades.map((g, i) => ({ name: "Note " + (i + 1), v: g.v, w: g.w, f: g.f })) }]
      : [];
    const ex = s.exam || {};
    return {
      id: s.id || uid(), code: nStr(s.code, 3), name: nStr(s.name, 140), w: nW(s.w, 1), goal: nG(s.goal),
      exam: { on: !!ex.on, name: nStr(ex.name, 100, "Examen"), v: nG(ex.v), f: !!ex.f, date: nDate(ex.date) },
      subs: subs.filter(x => x && typeof x.name === "string").map(x => ({
        id: x.id || uid(), name: nStr(x.name, 100), w: nW(x.w, 1),
        evals: (Array.isArray(x.evals) ? x.evals : []).filter(e => e && typeof e === "object").map(e => ({
          id: e.id || uid(), name: nStr(e.name, 160, "Évaluation") || "Évaluation", date: nDate(e.date), w: nW(e.w, 1), v: nG(e.v), f: !!e.f, ne: !!e.ne
        }))
      }))
    };
  });
  o.updatedAt = +d.updatedAt || 0;
  return o;
}
function load(){
  try { const s = localStorage.getItem(KEY); if (s){ const d = normalize(JSON.parse(s)); if (d){ S = d; return; } } } catch(e){}
  try { const s = localStorage.getItem(OLD); if (s){ const d = normalize(JSON.parse(s)); if (d){ S = d; save(); } } } catch(e){}
}
function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Impossible d'enregistrer sur cet appareil"); }
}
function importFromLink(){
  const m = location.hash.match(/^#([nd])=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  try {
    const sig = m[1] === "n" ? m[2].slice(0, 64) : "d:" + m[2].slice(0, 64) + ":" + m[2].length;
    if (localStorage.getItem(IMP) === sig) return;
    const b64 = m[2].replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
    const d = normalize(JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))));
    if (d){ S = d; save(); localStorage.setItem(IMP, sig); setTimeout(() => toast("Tes notes sont chargées"), 300); }
  } catch(e){}
}

/* ---------- maths (same rules as the school portal) ---------- */
function wavg(pairs){ let s = 0, w = 0; for (const [v, ww] of pairs){ if (ww > 0){ s += v * ww; w += ww; } } return w > 0 ? s / w : null; }
const counts = e => e.v != null && !e.ne;
const subAvg = (x, fut) => wavg(x.evals.filter(e => counts(e) && (fut || !e.f)).map(e => [e.v, e.w]));
function contAvg(s, fut){ const p = []; for (const x of s.subs){ const a = subAvg(x, fut); if (a != null) p.push([a, x.w]); } return wavg(p); }
const examVal = (s, fut) => s.exam.on && s.exam.v != null && (fut || !s.exam.f) ? s.exam.v : null;
function domAvg(s, fut){ const c = contAvg(s, fut), e = examVal(s, fut); if (c == null) return e; if (e == null) return c; return (c + e) / 2; }
function genAvg(fut, list = S.subjects){ const p = []; for (const s of list){ const a = domAvg(s, fut); if (a != null) p.push([a, s.w]); } return wavg(p); }
const subHasPlan = x => x.evals.some(e => e.f && counts(e));
const hasPlan = s => (s.exam.on && s.exam.v != null && s.exam.f) || s.subs.some(subHasPlan);
const anyPlan = () => S.subjects.some(hasPlan);

/* ---------- formatting ---------- */
function fx(x, dec = S.settings.dec){ if (x == null || !isFinite(x)) return "–"; const p = 10 ** dec; return (Math.round(x * p + 1e-9) / p).toFixed(dec); }
function fg(v){ const r = Math.round(v * 100) / 100; return Math.abs(r * 10 - Math.round(r * 10)) < 1e-9 ? r.toFixed(1) : r.toFixed(2); }
const fw = w => String(Math.round(w * 100) / 100);
const tone = x => x == null ? "" : (x >= 4 ? "pass" : "fail");
const fdate = d => { if (!d) return ""; const [y, m, dd] = d.split("-"); return dd + "." + m + "." + y; };
const findDom = id => S.subjects.find(s => s.id === id);

const ic = (n, cls = "") => `<svg class="ic${cls ? " " + cls : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

function scale(cur, fut, big){
  const pos = v => ((Math.max(1, Math.min(6, v)) - 1) / 5 * 100).toFixed(2) + "%";
  let h = `<div class="scale${big ? " big" : ""}" aria-hidden="true"><div class="rail"><span class="zone low"></span><span class="zone high"></span></div>`;
  if (cur != null) h += `<div class="fill ${tone(cur)}" style="width:${pos(cur)}"></div>`;
  h += `<div class="passline" style="left:${pos(4)}"></div>`;
  if (big) h += `<div class="ticks">` + [1,2,3,4,5,6].map(n => `<span class="tick${n === 4 ? " four" : ""}" style="left:${pos(n)}">${n}</span>`).join("") + `</div>`;
  if (fut != null && (cur == null || Math.abs(fut - cur) > 0.004)){
    if (cur != null){ const a = Math.min(cur, fut), b = Math.max(cur, fut); h += `<div class="planseg" style="left:${pos(a)};width:calc(${pos(b)} - ${pos(a)})"></div>`; }
    h += `<div class="dot plan" style="left:${pos(fut)}"></div>`;
  }
  if (cur != null) h += `<div class="dot ${tone(cur)}" style="left:${pos(cur)}"></div>`;
  return h + `</div>`;
}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === nav.tab));
  if (nav.dom && !findDom(nav.dom)) nav.dom = null;
  let h;
  if (nav.tab === "hist") h = histHTML();
  else if (nav.tab === "set") h = setHTML();
  else h = nav.dom ? domHTML(findDom(nav.dom)) : homeHTML();
  const v = $("#view"); v.innerHTML = h;
  if (animNext){ v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter"); animNext = false; }
  if (nav.tab === "notes" && nav.dom) updateSim();
}

function homeHTML(){
  const g = genAvg(false), gf = genAvg(true), plan = anyPlan(), goal = S.settings.goal;
  const weak = S.subjects.filter(s => { const a = domAvg(s, false); return a != null && a < 4; });
  let nReal = 0, nPlan = 0, best = null;
  for (const s of S.subjects){
    for (const x of s.subs) for (const e of x.evals) if (counts(e)){ if (e.f) nPlan++; else nReal++; }
    if (s.exam.on && s.exam.v != null){ if (s.exam.f) nPlan++; else nReal++; }
    const a = domAvg(s, false); if (a != null && (!best || a > best.a)) best = { s, a };
  }
  const upd = S.updatedAt ? new Date(S.updatedAt).toLocaleDateString("fr-CH", { day: "numeric", month: "long" }) : "";
  let h = `<header class="phead"><h1 class="ptitle">Mes moyennes</h1>${upd ? `<p class="psub">Dernière modification le ${upd}</p>` : ``}</header>
  <div class="home-top">
  <section class="hero">
    <div class="hero-top">
      <div><div class="hero-label">Moyenne générale</div><div class="hero-num ${tone(g)}">${fx(g, 2)}</div></div>
      <div class="chips">
        ${g != null ? `<span class="chip ${tone(g)}">${ic(g >= 4 ? "check" : "alert")}${g >= 4 ? "Au-dessus de 4" : "Sous 4"}</span>` : ``}
        ${plan && gf != null ? `<span class="chip plan">${ic("spark")}Avec tes prévisions : ${fx(gf, 2)}</span>` : ``}
        ${goal != null && g != null ? `<span class="chip">${ic("target")}Objectif ${fg(goal)} : ${g >= goal ? "atteint" : "il manque " + fx(goal - g, 2)}</span>` : ``}
      </div>
    </div>
    ${scale(g, plan ? gf : null, true)}
  </section>
  <div class="stats">
    <div class="stat"><span class="stat-k">Notes reçues</span><span class="stat-v">${nReal}</span></div>
    <div class="stat"><span class="stat-k">Meilleur</span><span class="stat-v">${best ? esc(best.s.code || "–") : "–"}${best ? `<small class="${tone(best.a)}">${fx(best.a)}</small>` : ``}</span></div>
    <div class="stat"><span class="stat-k">Prévisions</span><span class="stat-v${nPlan ? " plan" : ""}">${nPlan}</span></div>
  </div>
  </div>`;
  if (weak.length) h += `<div class="alert">${ic("alert")}<div><b>Sous la barre de 4</b>${weak.map(s => `<button data-open="${s.id}">${esc(s.name)}</button> (${fx(domAvg(s, false))})`).join(", ")}</div></div>`;
  h += `<div class="shead"><h2 class="sec">Domaines</h2><button class="btn ghost sm" data-act="newDom">${ic("plus")}Ajouter</button></div>`;
  if (!S.subjects.length) h += emptyBox("grid", "Aucun domaine pour l'instant", "Crée un domaine, par exemple A ou Italien, puis ajoute tes notes dedans.", "newDom", "Créer un domaine");
  else {
    h += `<div class="dgrid">`;
    for (const s of S.subjects){
      const a = domAvg(s, false), af = domAvg(s, true), p = hasPlan(s);
      h += `<button class="drow" data-open="${s.id}"><span class="badge ${tone(a)}">${esc(s.code || "?")}</span>
        <span class="dmain"><span class="dname">${esc(s.name)}</span>${needLine(s)}${scale(a, p ? af : null, false)}</span>
        <span class="dnum"><span class="${tone(a)}">${fx(a)}</span>${p && af != null ? `<small class="plan">${fx(af)}</small>` : ``}</span>${ic("chev", "chev")}</button>`;
    }
    h += `</div>`;
  }
  h += `<div class="shead"><h2 class="sec">Autres évaluations</h2><button class="btn ghost sm" data-act="newExtra">${ic("plus")}Ajouter</button></div><div class="list">`;
  for (const x of S.extras) h += `<button class="srow" data-extra="${x.id}"><span class="lead">${ic("percent")}</span><span class="stext">${esc(x.name)}</span><span class="val">${x.p == null ? "–" : fw(x.p) + " %"}</span>${ic("chev", "chev")}</button>`;
  if (!S.extras.length) h += `<div class="empty-s">Mandats pratiques, UEP… notés en pourcentage.</div>`;
  return h + `</div>`;
}

function emptyBox(icon, title, text, act, label){
  return `<div class="empty">${ic(icon, "empty-ic")}<p class="empty-t">${title}</p><p class="empty-d">${text}</p>${act ? `<button class="btn primary sm" data-act="${act}">${ic("plus")}${label}</button>` : ``}</div>`;
}
const THEAD = `<div class="thead" aria-hidden="true"><span>Évaluation</span><span>Date</span><span>Coef.</span><span class="r">Note</span></div>`;

function evalRow(e, s, x, withCtx){
  let pill;
  if (e.ne) pill = `<span class="pill ne">Non év.</span>`;
  else if (e.v == null) pill = `<span class="pill none">–</span>`;
  else pill = `<span class="pill ${e.f ? "plan" : tone(e.v)}">${fg(e.v)}</span>`;
  const attrs = x ? `data-eval="${e.id}" data-esub="${x.id}" data-edom="${s.id}"` : `data-examdom="${s.id}"`;
  const date = e.date ? fdate(e.date) : "Sans date";
  return `<button class="erow" ${attrs}><span class="ec-name"><span class="ename">${esc(e.name)}</span><span class="emeta">${
      withCtx ? `<span class="ectx"><b>${esc(s.code || s.name)}</b> ${esc(x ? x.name : "")}</span>` : ``}<span class="m-only">${date}</span>${
      e.w != null ? `<span class="m-only">coef ${fw(e.w)}</span>` : ``}${e.f ? `<span class="flag">Prévision</span>` : ``}</span></span><span class="ec-date">${date}</span><span class="ec-coef">${e.w != null ? fw(e.w) : "–"}</span>${pill}</button>`;
}

function domHTML(s){
  const a = domAvg(s, false), af = domAvg(s, true), p = hasPlan(s), c = contAvg(s, false), ev = examVal(s, false);
  const n = s.subs.reduce((k, x) => k + x.evals.length, 0);
  let main = "";
  for (const x of s.subs){
    const sa = subAvg(x, false), sf = subAvg(x, true), sp = subHasPlan(x);
    const evs = [...x.evals].sort((m, n) => (m.date || "9999") < (n.date || "9999") ? -1 : (m.date || "9999") > (n.date || "9999") ? 1 : 0);
    main += `<section class="block"><div class="bhead"><button class="bname" data-sub="${x.id}"><span>${esc(x.name)}</span><span class="tag">coef ${fw(x.w)}</span>${ic("edit", "bedit")}</button>
      <span class="bavg"><span class="${tone(sa)}">${fx(sa)}</span>${sp && sf != null ? `<small class="plan">${fx(sf)}</small>` : ``}</span></div>
      ${evs.length ? THEAD : ``}${evs.map(e => evalRow(e, s, x, false)).join("")}<button class="addrow" data-adde="${x.id}">${ic("plus")}Ajouter une note</button></section>`;
  }
  main += `<button class="btn ghost sm addsub" data-act="newSub">${ic("plus")}Ajouter une sous-branche</button>`;
  if (s.exam.on){
    main += `<section class="block exam"><div class="bhead"><span class="bname"><span>${esc(s.exam.name)}</span><span class="tag plan">50 % de la moyenne</span></span></div>`;
    main += s.exam.v != null ? THEAD + evalRow({ name: "Note d'examen", date: s.exam.date, w: null, v: s.exam.v, f: s.exam.f, ne: false }, s, null, false)
                             : `<button class="addrow" data-examdom="${s.id}">${ic("plus")}Ajouter la note d'examen</button>`;
    main += `</section>`;
  }
  const hero = `<section class="hero hero-d">
    <div class="hero-row"><div><div class="hero-label">Moyenne du domaine</div><div class="hero-num md ${tone(a)}">${fx(a)}</div></div>
    ${p ? `<div class="right"><div class="hero-label">Avec prévisions</div><div class="hero-num md plan">${fx(af)}</div></div>` : ``}</div>
    ${scale(a, p ? af : null, true)}
    ${s.exam.on && examVal(s, true) != null ? `<div class="split"><div><small>Cours, 50 %</small><b class="${tone(c)}">${fx(c)}</b></div><div><small>Examen, 50 %</small><b class="${tone(ev)}">${ev != null ? fg(ev) : "–"}</b></div></div>` : ``}
  </section>`;
  return `<div class="dtop"><button class="crumb" data-act="back">${ic("back")}Domaines</button><button class="btn secondary sm" data-act="editDom">${ic("edit")}Modifier</button></div>
  <header class="dhead"><span class="badge xl ${tone(a)}">${esc(s.code || "?")}</span><div class="dhead-t"><h1 class="dtitle">${esc(s.name)}</h1>
    <p class="psub">${s.subs.length} sous-branche${s.subs.length > 1 ? "s" : ""}, ${n} évaluation${n > 1 ? "s" : ""}${s.exam.on ? ", examen à 50 %" : ""}</p></div></header>
  <div class="dlayout"><div class="dmaincol">${main}</div><aside class="dside">${hero}${goalHTML(s)}${simHTML(s)}</aside></div>`;
}

function simOpts(s){
  const o = [];
  for (const x of s.subs) if (x.w > 0) o.push([x.id, x.name]);
  if (s.exam.on && s.exam.v != null && s.exam.f) o.push(["exam", s.exam.name || "Examen"]);
  return o;
}
function simHTML(s){
  const opts = simOpts(s);
  if (!opts.length) return "";
  const st = sim[s.id] || (sim[s.id] = { where: opts[0][0], coef: "1", x: 4, target: S.settings.goal != null ? fg(S.settings.goal) : "4" });
  if (!opts.some(o => o[0] === st.where)) st.where = opts[0][0];
  return `<section class="card simwrap">
    <div class="cardhead"><span class="lead">${ic("sim")}</span><div><h2>Simulation</h2><p>Teste une note avant de l'avoir reçue.</p></div></div>
    <div class="simgrid">
      <label class="lbl">Prochaine note en<select class="inp" id="simWhere">${opts.map(o => `<option value="${o[0]}"${o[0] === st.where ? " selected" : ""}>${esc(o[1])}</option>`).join("")}</select></label>
      <label class="lbl" id="simCoefWrap"${st.where === "exam" ? " hidden" : ""}>Coef.<input class="inp" id="simCoef" inputmode="decimal" value="${esc(st.coef)}"></label>
    </div>
    <div class="slider">
      <div class="sline"><span>Si j'ai</span><strong id="simX">${fg(st.x)}</strong></div>
      <input type="range" id="simRange" min="1" max="6" step="0.1" value="${st.x}" aria-label="Note simulée">
      <div class="sres" id="simRes"></div>
    </div>
    <div class="need">
      <label class="lbl">Pour avoir<input class="inp" id="simTarget" inputmode="decimal" value="${esc(st.target)}"></label>
      <div class="needout" id="simNeed"></div>
    </div>
    ${hasPlan(s) ? `<p class="hint">Tes prévisions sont comptées dans la simulation.</p>` : ``}
  </section>`;
}
function hypo(s, st, x){
  const c = clone(s);
  if (st.where === "exam"){ c.exam.v = x; c.exam.f = true; }
  else { const sub = c.subs.find(y => y.id === st.where); if (!sub) return null; const w = num(st.coef); sub.evals.push({ v: x, w: w > 0 ? w : 1, f: true, ne: false }); }
  return domAvg(c, true);
}
function updateSim(){
  const s = findDom(nav.dom); const st = s && sim[s.id]; if (!st || !$("#simRes")) return;
  const r = hypo(s, st, st.x);
  $("#simX").textContent = fg(st.x);
  let subLine = "";
  if (st.where !== "exam"){
    const x = s.subs.find(y => y.id === st.where);
    if (x){ const c = clone(x), w = num(st.coef); c.evals.push({ v: st.x, w: w > 0 ? w : 1, f: true, ne: false }); const sa = subAvg(c, true);
      subLine = `<span class="sres-row"><span>${esc(x.name)} passe à</span><strong class="${tone(sa)}">${fx(sa, 2)}</strong></span>`; }
  }
  $("#simRes").innerHTML = subLine + `<span class="sres-row"><span>Moyenne du domaine</span><strong class="${tone(r)}">${fx(r, 2)}</strong></span>`;
  const out = $("#simNeed"), T = num(st.target);
  if (!(T >= 1 && T <= 6)){ out.textContent = "Entre une moyenne entre 1 et 6."; return; }
  const f1 = hypo(s, st, 1), f6 = hypo(s, st, 6);
  if (f1 == null || f6 == null || Math.abs(f6 - f1) < 1e-9){ out.textContent = ""; return; }
  const need = 1 + (T - f1) * 5 / (f6 - f1);
  if (need > 6) out.innerHTML = `il faudrait <strong class="fail">${fx(need, 2)}</strong>, pas atteignable avec une seule note.`;
  else if (need <= 1) out.innerHTML = `<strong class="pass">c'est assuré</strong>, même avec un 1.`;
  else out.innerHTML = `il te faut au moins <strong>${(Math.ceil(need * 10 - 1e-9) / 10).toFixed(1)}</strong>`;
}

/* ---------- next grade needed for the target ---------- */
const domTarget = s => s.goal != null ? s.goal : (S.settings.goal != null ? S.settings.goal : 4);
function needGrade(s, where, coef, T){
  const st = { where, coef: String(coef) };
  const f1 = hypo(s, st, 1), f6 = hypo(s, st, 6);
  if (f1 == null || f6 == null || Math.abs(f6 - f1) < 1e-9) return null;
  return 1 + (T - f1) * 5 / (f6 - f1);
}
function needOptions(s){
  const o = [];
  for (const x of s.subs) if (x.w > 0) o.push([x.id, "Prochaine note en " + x.name, "en " + x.name]);
  return o;
}
function needOut(n){
  if (n == null) return `<strong>–</strong>`;
  if (n > 6) return `<strong class="fail">pas atteignable</strong>`;
  if (n <= 1) return `<strong class="pass">déjà assuré</strong>`;
  return `<strong class="${n > 5 ? "fail" : ""}">${(Math.ceil(n * 10 - 1e-9) / 10).toFixed(1)}</strong>`;
}
function needLine(s){
  const o = needOptions(s); if (!o.length) return "";
  const T = domTarget(s);
  let main = o[0], n = needGrade(s, main[0], 1, T);
  for (const x of o.slice(1)){ const m = needGrade(s, x[0], 1, T); if (m != null && (n == null || m < n)){ n = m; main = x; } }
  const txt = n == null ? "" : n > 6 ? `<b class="fail">pas atteignable</b>` : n <= 1 ? `<b class="pass">déjà assuré</b>` : `il te faut <b>${(Math.ceil(n * 10 - 1e-9) / 10).toFixed(1)}</b> ${esc(main[2])}`;
  return txt ? `<span class="dneed">${ic("target")}<span>Pour ${fg(T)} : ${txt}</span></span>` : "";
}
function goalHTML(s){
  const o = needOptions(s); if (!o.length) return "";
  const T = domTarget(s);
  return `<section class="card goalwrap">
    <div class="cardhead"><span class="lead">${ic("target")}</span><div class="ch-t"><h2>Objectif ${fg(T)}</h2><p>${s.goal != null ? "Objectif de ce domaine" : S.settings.goal != null ? "Ton objectif général" : "Par défaut : la barre de 4"}</p></div><button class="btn secondary sm" data-act="domGoal">Changer</button></div>
    <div class="needlist">${o.map(x => `<div class="nrow"><span>${esc(x[1])}${x[0] === "exam" ? "" : ` <small>coef 1</small>`}</span>${needOut(needGrade(s, x[0], 1, T))}</div>`).join("")}</div>
    <p class="hint">Note minimale à avoir à ta prochaine évaluation pour atteindre ${fg(T)}${hasPlan(s) ? ", en comptant tes prévisions" : ""}.</p>
  </section>`;
}
function domGoalSheet(domId){
  const s = findDom(domId); if (!s) return;
  openSheet(`<h2>Moyenne visée</h2><p class="ctx">${esc(s.code)} ${esc(s.name)}</p>
    <form id="fDomGoal" class="fstack" autocomplete="off">
      <label class="lbl">Objectif pour ce domaine<input class="inp" id="fV" inputmode="decimal" value="${s.goal != null ? fg(s.goal) : ""}" placeholder="${fg(S.settings.goal != null ? S.settings.goal : 4)} par défaut"></label>
      <p class="hint" style="margin:0">Laisse vide pour utiliser ${S.settings.goal != null ? "ton objectif général (" + fg(S.settings.goal) + ")" : "la barre de 4"}.</p>
      ${actions("Enregistrer")}
    </form>`, { type: "domGoal", domId });
  $("#fV").focus();
}

function histHTML(){
  const all = [];
  for (const s of S.subjects){
    for (const x of s.subs) for (const e of x.evals) all.push({ e, s, x });
    if (s.exam.on && s.exam.v != null) all.push({ e: { id: "exam", name: s.exam.name, date: s.exam.date, w: null, v: s.exam.v, f: s.exam.f, ne: false }, s, x: null });
  }
  let h = `<header class="phead"><h1 class="ptitle">Historique</h1><p class="psub">${all.length} évaluation${all.length > 1 ? "s" : ""}, de la plus récente à la plus ancienne</p></header>` + chartHTML();
  if (!all.length) return h + `<div style="margin-top:16px">` + emptyBox("hist", "Pas encore de notes", "Tes évaluations apparaîtront ici, classées par mois.", "", "") + `</div>`;
  all.sort((a, b) => (b.e.date || "") < (a.e.date || "") ? -1 : (b.e.date || "") > (a.e.date || "") ? 1 : 0);
  let cur = null, open = false;
  for (const it of all){
    const k = it.e.date ? it.e.date.slice(0, 7) : "";
    if (k !== cur){
      if (open) h += `</div>`;
      const label = k ? new Date(k + "-15").toLocaleDateString("fr-CH", { month: "long", year: "numeric" }) : "Sans date";
      h += `<h2 class="month">${label.charAt(0).toUpperCase() + label.slice(1)}</h2><div class="list">${THEAD}`;
      cur = k; open = true;
    }
    h += evalRow(it.e, it.s, it.x, true);
  }
  return h + (open ? `</div>` : ``);
}
function chartHTML(){
  const dates = new Set();
  for (const s of S.subjects){
    for (const x of s.subs) for (const e of x.evals) if (counts(e) && !e.f && e.date) dates.add(e.date);
    if (s.exam.on && s.exam.v != null && !s.exam.f && s.exam.date) dates.add(s.exam.date);
  }
  const ds = [...dates].sort();
  const pts = [];
  for (const d of ds){
    const list = S.subjects.map(s => ({ ...s,
      exam: { ...s.exam, v: s.exam.date && s.exam.date <= d ? s.exam.v : null },
      subs: s.subs.map(x => ({ ...x, evals: x.evals.filter(e => e.date && e.date <= d) })) }));
    const g = genAvg(false, list); if (g != null) pts.push([d, g]);
  }
  const head = (v, delta) => `<div class="chart-h"><div><div class="hero-label">Évolution de la moyenne générale</div>${v != null ? `<div class="chart-v ${tone(v)}">${fx(v, 2)}</div>` : ``}</div>${delta || ""}</div>`;
  if (pts.length < 2) return `<section class="chart">${head(null)}<p class="hint" style="margin:0">La courbe apparaît dès que tu as des notes à deux dates différentes.</p></section>`;
  const vw = window.innerWidth, W = vw >= 1024 ? 960 : vw >= 700 ? 640 : 320, H = vw >= 1024 ? 220 : vw >= 700 ? 180 : 140, t = s => new Date(s + "T12:00:00").getTime();
  const t0 = t(pts[0][0]), t1 = t(pts[pts.length - 1][0]);
  const vals = pts.map(p => p[1]);
  const lo = Math.max(1, Math.min(3.5, Math.floor((Math.min(...vals) - .3) * 2) / 2)), hi = Math.min(6, Math.max(5.5, Math.ceil((Math.max(...vals) + .3) * 2) / 2));
  const X = d => ((t(d) - t0) / Math.max(1, t1 - t0)) * W, Y = v => H - (v - lo) / (hi - lo) * H;
  const path = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const area = path + ` L${X(pts[pts.length - 1][0]).toFixed(1)} ${H} L0 ${H} Z`;
  const first = pts[0], last = pts[pts.length - 1], dv = last[1] - first[1];
  let grid = "";
  for (let v = Math.ceil(lo); v <= hi; v++){
    grid += v === 4
      ? `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--ink);stroke-opacity:.45" stroke-dasharray="4 4"/>`
      : `<line x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--border-2)"/>`;
    grid += `<text x="${W + 8}" y="${Y(v) + 4}" font-size="11" style="fill:${v === 4 ? "var(--ink)" : "var(--faint)"}" ${v === 4 ? `font-weight="700"` : ``}>${v}</text>`;
  }
  const delta = `<span class="chip ${Math.abs(dv) < 0.005 ? "" : dv > 0 ? "pass" : "fail"}">${dv > 0 ? "+" : ""}${fx(dv, 2)} depuis le ${fdate(first[0])}</span>`;
  return `<section class="chart">${head(last[1], delta)}
    <svg viewBox="-4 -10 ${W + 26} ${H + 20}" role="img" aria-label="Moyenne générale de ${fx(first[1], 2)} à ${fx(last[1], 2)}">
      <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--plan);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--plan);stop-opacity:0"/></linearGradient></defs>
      ${grid}
      <path d="${area}" fill="url(#areaGrad)"/>
      <path d="${path}" fill="none" style="stroke:var(--plan)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.6" style="fill:var(--surface);stroke:var(--plan)" stroke-width="1.6"><title>${fdate(p[0])} : ${fx(p[1], 2)}</title></circle>`).join("")}
      <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="6.5" style="fill:var(--${last[1] >= 4 ? "pass" : "fail"});stroke:var(--surface)" stroke-width="3"/>
    </svg>
    <div class="cap"><span>${fdate(first[0])}</span><span>${fdate(last[0])}</span></div></section>`;
}

function setHTML(){
  const n = S.subjects.reduce((k, s) => k + s.subs.reduce((j, x) => j + x.evals.length, 0), 0);
  return `<header class="phead"><h1 class="ptitle">Réglages</h1><p class="psub">Affichage, objectif et sauvegarde de tes notes</p></header>
  <h2 class="sec">Affichage des moyennes</h2>
  <div class="list"><div class="seg" role="group" aria-label="Décimales">
    <button data-dec="1" class="${S.settings.dec === 1 ? "on" : ""}">Comme l'école (4.7)</button>
    <button data-dec="2" class="${S.settings.dec === 2 ? "on" : ""}">Précis (4.71)</button></div></div>
  <h2 class="sec">Objectif</h2>
  <div class="list"><button class="srow" data-act="goal"><span class="lead">${ic("target")}</span><span class="stext">Moyenne générale visée</span><span class="val">${S.settings.goal != null ? fg(S.settings.goal) : "aucun"}</span>${ic("chev", "chev")}</button></div>
  <h2 class="sec">Sauvegarde</h2>
  <div class="list">
    <button class="srow" data-act="copyBackup"><span class="lead">${ic("copy")}</span><span class="stext">Copier le code de sauvegarde</span><span class="val">${n} notes</span></button>
    <button class="srow" data-act="restore"><span class="lead">${ic("restore")}</span><span class="stext">Restaurer depuis un code</span>${ic("chev", "chev")}</button>
    <button class="srow" data-act="copySummary"><span class="lead">${ic("text")}</span><span class="stext">Copier un résumé de mes moyennes</span></button>
  </div>
  <p class="note">Tes notes restent sur ce téléphone. Garde le code de sauvegarde dans Notes ou par mail : il permet de tout récupérer.</p>
  <h2 class="sec">Zone sensible</h2>
  <div class="list"><button class="srow danger" data-act="wipe"><span class="lead">${ic("trash")}</span><span class="stext">Effacer toutes les notes</span></button></div>`;
}

/* ---------- sheets ---------- */
function openSheet(html, state){ sheet = state; $("#sheetBody").innerHTML = `<div class="grab"></div><button class="sheet-x" type="button" data-act="close" aria-label="Fermer">${ic("x")}</button>` + html; $("#sheet").hidden = false; }
function closeSheet(){ sheet = null; $("#sheet").hidden = true; $("#sheetBody").innerHTML = ""; }
const sw = (id, label, on, hint) => `<label class="switch"><span>${label}${hint ? `<small>${hint}</small>` : ""}</span><input type="checkbox" id="${id}"${on ? " checked" : ""}><span class="knob"></span></label>`;
const actions = (save, del) => `<div class="err" id="ferr"></div><div class="actions"><button class="btn primary" type="submit">${save}</button>${del ? `<button class="btn danger" type="button" data-act="del">${del}</button>` : ""}<button class="btn quiet" type="button" data-act="close">Annuler</button></div>`;

function evalSheet(domId, subId, evalId){
  const s = findDom(domId), x = s && s.subs.find(y => y.id === subId); if (!x) return;
  const e = evalId ? x.evals.find(y => y.id === evalId) : null;
  openSheet(`<h2>${e ? "Modifier la note" : "Nouvelle note"}</h2><p class="ctx">${esc(s.code)} ${esc(x.name)}</p>
    <form id="fEval" class="fstack" autocomplete="off">
      <label class="lbl">Nom de l'évaluation<input class="inp" id="fName" value="${e ? esc(e.name) : ""}" placeholder="Ex. Test chapitre 2" maxlength="160"></label>
      <label class="lbl">Date<input class="inp" type="date" id="fDate" value="${e ? e.date : today()}"></label>
      <div class="row2">
        <label class="lbl">Note<input class="inp" id="fV" inputmode="decimal" value="${e && e.v != null ? fg(e.v) : ""}" placeholder="1 à 6"></label>
        <label class="lbl">Coefficient<input class="inp" id="fW" inputmode="decimal" value="${e ? fw(e.w) : "1"}"></label>
      </div>
      ${sw("fF", "Prévision", e ? e.f : false, "Note que tu penses avoir, pas encore reçue")}
      ${sw("fNe", "Non évaluée", e ? e.ne : false, "Ne compte pas dans la moyenne")}
      ${actions(e ? "Enregistrer" : "Ajouter la note", e ? "Supprimer la note" : "")}
    </form>`, { type: "eval", domId, subId, evalId });
  if (!e) $("#fV").focus();
}
function examSheet(domId){
  const s = findDom(domId); if (!s) return;
  openSheet(`<h2>Note d'examen</h2><p class="ctx">${esc(s.exam.name)}, 50 % de la moyenne</p>
    <form id="fExam" class="fstack" autocomplete="off">
      <div class="row2"><label class="lbl">Note<input class="inp" id="fV" inputmode="decimal" value="${s.exam.v != null ? fg(s.exam.v) : ""}" placeholder="1 à 6"></label>
      <label class="lbl">Date<input class="inp" type="date" id="fDate" value="${s.exam.date || today()}"></label></div>
      ${sw("fF", "Prévision", s.exam.f, "Note que tu penses avoir")}
      ${actions("Enregistrer", s.exam.v != null ? "Effacer la note" : "")}
    </form>`, { type: "exam", domId });
  if (s.exam.v == null) $("#fV").focus();
}
function subSheet(domId, subId){
  const s = findDom(domId); if (!s) return;
  const x = subId ? s.subs.find(y => y.id === subId) : null;
  openSheet(`<h2>${x ? "Modifier la sous-branche" : "Nouvelle sous-branche"}</h2><p class="ctx">${esc(s.code)} ${esc(s.name)}</p>
    <form id="fSub" class="fstack" autocomplete="off">
      <label class="lbl">Nom<input class="inp" id="fName" value="${x ? esc(x.name) : ""}" placeholder="Ex. DCOa3 (BD)" maxlength="100"></label>
      <label class="lbl">Coefficient dans le domaine<input class="inp" id="fW" inputmode="decimal" value="${x ? fw(x.w) : "1"}"></label>
      ${actions(x ? "Enregistrer" : "Ajouter", x ? "Supprimer la sous-branche et ses notes" : "")}
    </form>`, { type: "sub", domId, subId });
}
function domSheet(domId){
  const s = domId ? findDom(domId) : null;
  openSheet(`<h2>${s ? "Modifier le domaine" : "Nouveau domaine"}</h2>
    <form id="fDom" class="fstack" autocomplete="off">
      <div class="row2" style="grid-template-columns:90px 1fr">
        <label class="lbl">Lettre<input class="inp" id="fCode" value="${s ? esc(s.code) : ""}" maxlength="3" placeholder="F"></label>
        <label class="lbl">Coef. général<input class="inp" id="fW" inputmode="decimal" value="${s ? fw(s.w) : "1"}"></label>
      </div>
      <label class="lbl">Nom<input class="inp" id="fName" value="${s ? esc(s.name) : ""}" maxlength="140" placeholder="Ex. Allemand"></label>
      ${sw("fEx", "Examen à 50 %", s ? s.exam.on : true, "L'examen compte pour la moitié de la moyenne")}
      <label class="lbl">Nom de l'examen<input class="inp" id="fExName" value="${s ? esc(s.exam.name) : "Examen"}" maxlength="100"></label>
      ${actions(s ? "Enregistrer" : "Créer le domaine", s ? "Supprimer le domaine et ses notes" : "")}
    </form>`, { type: "dom", domId });
}
function extraSheet(id){
  const x = id ? S.extras.find(y => y.id === id) : null;
  openSheet(`<h2>${x ? "Modifier" : "Nouvelle évaluation en %"}</h2>
    <form id="fExtra" class="fstack" autocomplete="off">
      <label class="lbl">Nom<input class="inp" id="fName" value="${x ? esc(x.name) : ""}" maxlength="100"></label>
      <label class="lbl">Pourcentage<input class="inp" id="fP" inputmode="decimal" value="${x && x.p != null ? fw(x.p) : ""}" placeholder="0 à 100"></label>
      ${actions(x ? "Enregistrer" : "Ajouter", x ? "Supprimer" : "")}
    </form>`, { type: "extra", id });
}
function goalSheet(){
  openSheet(`<h2>Moyenne générale visée</h2><p class="ctx">Laisse vide pour ne pas avoir d'objectif.</p>
    <form id="fGoal" class="fstack" autocomplete="off">
      <label class="lbl">Objectif<input class="inp" id="fV" inputmode="decimal" value="${S.settings.goal != null ? fg(S.settings.goal) : ""}" placeholder="Ex. 5"></label>
      ${actions("Enregistrer")}
    </form>`, { type: "goal" });
  $("#fV").focus();
}
function restoreSheet(){
  openSheet(`<h2>Restaurer</h2><p class="ctx">Colle ton code de sauvegarde. Il remplace toutes les notes actuelles.</p>
    <form id="fRestore" class="fstack" autocomplete="off">
      <textarea class="inp" id="fCode" placeholder="Code de sauvegarde"></textarea>
      <div class="err" id="ferr"></div>
      <div class="actions"><button class="btn primary" type="submit" id="restoreBtn">Restaurer</button><button class="btn quiet" type="button" data-act="close">Annuler</button></div>
    </form>`, { type: "restore", armed: false });
}

/* ---------- actions ---------- */
let toastT = null;
function toast(msg){ const t = $("#toast"); t.innerHTML = ic("check") + `<span>${esc(msg)}</span>`; t.hidden = true; void t.offsetWidth; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function copy(text, done){
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch(e){ toast("Copie impossible"); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function summary(){
  const L = [`Moyenne générale : ${fx(genAvg(false), 2)}` + (anyPlan() ? ` (avec prévisions ${fx(genAvg(true), 2)})` : "")];
  for (const s of S.subjects) L.push(`${s.code ? s.code + ". " : ""}${s.name} : ${fx(domAvg(s, false))}`);
  for (const x of S.extras) L.push(`${x.name} : ${x.p == null ? "–" : fw(x.p) + " %"}`);
  return L.join("\n");
}
function armed(btn, label){
  if (btn.dataset.armed){ return true; }
  btn.dataset.armed = "1"; btn.classList.add("armed"); btn.textContent = label; return false;
}
const go = (patch) => { Object.assign(nav, patch); animNext = true; render(); window.scrollTo(0, 0); };

document.addEventListener("click", ev => {
  const t = ev.target.closest("button, .backdrop"); if (!t) return;
  const d = t.dataset;
  if (d.tab){ go({ tab: d.tab, dom: d.tab === "notes" && nav.tab === "notes" ? null : nav.dom }); return; }
  if (d.open){ go({ tab: "notes", dom: d.open }); return; }
  if (d.eval){ evalSheet(d.edom, d.esub, d.eval); return; }
  if (d.adde){ evalSheet(nav.dom, d.adde, null); return; }
  if (d.examdom){ examSheet(d.examdom); return; }
  if (d.sub){ subSheet(nav.dom, d.sub); return; }
  if (d.extra){ extraSheet(d.extra); return; }
  if (d.dec){ S.settings.dec = +d.dec; save(); render(); return; }
  switch (d.act){
    case "back": go({ dom: null }); break;
    case "close": closeSheet(); break;
    case "newDom": domSheet(null); break;
    case "editDom": domSheet(nav.dom); break;
    case "newSub": subSheet(nav.dom, null); break;
    case "newExtra": extraSheet(null); break;
    case "goal": goalSheet(); break;
    case "domGoal": domGoalSheet(nav.dom); break;
    case "restore": restoreSheet(); break;
    case "copyBackup": copy(JSON.stringify({ v: 2, subjects: S.subjects, extras: S.extras, settings: S.settings }), () => toast("Code de sauvegarde copié")); break;
    case "copySummary": copy(summary(), () => toast("Résumé copié")); break;
    case "wipe":
      if (!armed(t, "Toucher encore pour tout effacer")) return;
      S = emptyState(); save(); nav.dom = null; render(); toast("Toutes les notes sont effacées"); break;
    case "del": onDelete(t); break;
  }
});

function onDelete(btn){
  if (!sheet) return;
  if (!armed(btn, "Confirmer")) return;
  const s = sheet.domId ? findDom(sheet.domId) : null;
  if (sheet.type === "eval"){ const x = s.subs.find(y => y.id === sheet.subId); x.evals = x.evals.filter(e => e.id !== sheet.evalId); }
  else if (sheet.type === "exam"){ s.exam.v = null; s.exam.f = false; s.exam.date = ""; }
  else if (sheet.type === "sub"){ s.subs = s.subs.filter(x => x.id !== sheet.subId); }
  else if (sheet.type === "dom"){ S.subjects = S.subjects.filter(x => x.id !== sheet.domId); nav.dom = null; }
  else if (sheet.type === "extra"){ S.extras = S.extras.filter(x => x.id !== sheet.id); }
  save(); closeSheet(); render();
}

const fail = msg => { $("#ferr").textContent = msg; };
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (!sheet) return;
  const s = sheet.domId ? findDom(sheet.domId) : null;
  const val = id => ($("#" + id) || {}).value || "";
  const chk = id => !!($("#" + id) || {}).checked;
  switch (sheet.type){
    case "eval": {
      const ne = chk("fNe"), v = num(val("fV")), w = num(val("fW"));
      if (!ne && !(v >= 1 && v <= 6)) return fail("Entre une note entre 1 et 6.");
      if (!(w >= 0 && w <= 100)) return fail("Le coefficient doit être un nombre positif.");
      const x = s.subs.find(y => y.id === sheet.subId);
      const data = { name: val("fName").trim() || "Évaluation", date: nDate(val("fDate")), w, v: v >= 1 && v <= 6 ? Math.round(v * 100) / 100 : null, f: chk("fF"), ne };
      if (sheet.evalId) Object.assign(x.evals.find(e => e.id === sheet.evalId), data); else x.evals.push({ id: uid(), ...data });
      break;
    }
    case "exam": {
      const v = num(val("fV"));
      if (!(v >= 1 && v <= 6)) return fail("Entre une note entre 1 et 6.");
      Object.assign(s.exam, { v: Math.round(v * 100) / 100, f: chk("fF"), date: nDate(val("fDate")) });
      break;
    }
    case "sub": {
      const name = val("fName").trim(), w = num(val("fW"));
      if (!name) return fail("Donne un nom à la sous-branche.");
      if (!(w >= 0 && w <= 100)) return fail("Le coefficient doit être un nombre positif.");
      if (sheet.subId) Object.assign(s.subs.find(y => y.id === sheet.subId), { name, w }); else s.subs.push({ id: uid(), name, w, evals: [] });
      break;
    }
    case "dom": {
      const name = val("fName").trim(), w = num(val("fW"));
      if (!name) return fail("Donne un nom au domaine.");
      if (!(w >= 0 && w <= 100)) return fail("Le coefficient doit être un nombre positif.");
      const patch = { name, code: val("fCode").trim().slice(0, 3), w };
      const exam = { on: chk("fEx"), name: val("fExName").trim() || "Examen" };
      if (s){ Object.assign(s, patch); Object.assign(s.exam, exam); }
      else { const n = { id: uid(), ...patch, goal: null, exam: { ...exam, v: null, f: false, date: "" }, subs: [{ id: uid(), name: "Notes", w: 1, evals: [] }] }; S.subjects.push(n); nav.dom = n.id; }
      break;
    }
    case "extra": {
      const name = val("fName").trim(), p = val("fP").trim() === "" ? null : num(val("fP"));
      if (!name) return fail("Donne un nom.");
      if (p !== null && !(p >= 0 && p <= 100)) return fail("Entre un pourcentage entre 0 et 100.");
      if (sheet.id) Object.assign(S.extras.find(y => y.id === sheet.id), { name, p }); else S.extras.push({ id: uid(), name, p });
      break;
    }
    case "domGoal": {
      const raw = val("fV").trim(), v = num(raw);
      if (raw && !(v >= 1 && v <= 6)) return fail("Entre une moyenne entre 1 et 6.");
      s.goal = raw ? Math.round(v * 100) / 100 : null;
      break;
    }
    case "goal": {
      const raw = val("fV").trim(), v = num(raw);
      if (raw && !(v >= 1 && v <= 6)) return fail("Entre une moyenne entre 1 et 6.");
      S.settings.goal = raw ? Math.round(v * 100) / 100 : null;
      break;
    }
    case "restore": {
      let d = null; try { d = normalize(JSON.parse(val("fCode"))); } catch(e){}
      if (!d) return fail("Ce code n'est pas valide. Copie-le en entier depuis ta sauvegarde.");
      const b = $("#restoreBtn");
      if (!armed(b, "Confirmer : remplacer mes notes")) return;
      S = d; nav.dom = null; save(); closeSheet(); render(); toast("Notes restaurées");
      return;
    }
  }
  save(); closeSheet(); render();
});

document.addEventListener("input", ev => {
  const id = ev.target.id, s = findDom(nav.dom), st = s && sim[s.id];
  if (ev.target.closest(".sheet")){ const e = $("#ferr"); if (e) e.textContent = ""; return; }
  if (!st) return;
  if (id === "simRange"){ st.x = +ev.target.value; updateSim(); }
  else if (id === "simCoef"){ st.coef = ev.target.value; updateSim(); }
  else if (id === "simTarget"){ st.target = ev.target.value; updateSim(); }
});
document.addEventListener("change", ev => {
  if (ev.target.id !== "simWhere") return;
  const s = findDom(nav.dom), st = s && sim[s.id]; if (!st) return;
  st.where = ev.target.value; $("#simCoefWrap").hidden = st.where === "exam"; updateSim();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && sheet) closeSheet(); });

load();
importFromLink();
document.body.classList.add("intro");
render();
setTimeout(() => document.body.classList.remove("intro"), 1400);
})();
</script>
</body>
</html>
